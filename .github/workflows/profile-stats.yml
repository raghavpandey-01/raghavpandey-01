name: Generate Profile Statistics

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout profile repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------
      # Create profile directory
      # --------------------------------------------------
      - name: Create profile directory
        run: mkdir -p profile

      # ==================================================
      # GITHUB STATS
      # ==================================================
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            {
              "username": "raghavpandey-01",
              "show_icons": true,
              "include_all_commits": true,
              "hide_rank": false,
              "hide_border": true,
              "bg_color": "0D1117",
              "title_color": "8B5CF6",
              "text_color": "C9D1D9",
              "icon_color": "8B5CF6",
              "border_color": "8B5CF6",
              "border_radius": 10
            }
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================
      # TOP LANGUAGES
      # ==================================================
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            {
              "username": "raghavpandey-01",
              "layout": "compact",
              "langs_count": 6,
              "hide_border": true,
              "bg_color": "0D1117",
              "title_color": "8B5CF6",
              "text_color": "C9D1D9",
              "border_color": "8B5CF6",
              "border_radius": 10
            }
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================
      # CONTRIBUTION STREAK
      # ==================================================
      - name: Generate Contribution Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            {
              "user": "raghavpandey-01",
              "theme": "dark",
              "background": "0D1117",
              "border": "8B5CF6",
              "stroke": "8B5CF6",
              "ring": "8B5CF6",
              "fire": "8B5CF6",
              "currStreakNum": "FFFFFF",
              "sideNums": "FFFFFF",
              "currStreakLabel": "8B5CF6",
              "sideLabels": "C9D1D9",
              "dates": "C9D1D9",
              "disableAnimations": true
            }
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================
      # GITHUB TROPHIES
      # ==================================================
      - name: Generate GitHub Trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: raghavpandey-01
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: darkhub

      # ==================================================
      # SHOW GENERATED FILES
      # ==================================================
      - name: Verify generated files
        run: |
          echo "Generated profile files:"
          ls -lh profile/

      # ==================================================
      # COMMIT GENERATED SVG FILES
      # ==================================================
      - name: Commit generated profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub profile statistics"
            git push
          fi
