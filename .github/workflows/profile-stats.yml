name: Generate Profile Statistics

on:
  schedule:
    - cron: "30 4 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ==================================================
      # CREATE PROFILE DIRECTORY
      # ==================================================
      - name: Create profile directory
        run: mkdir -p profile

      # ==================================================
      # GITHUB STATS
      # ==================================================
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            {
              "username": "raghavpandey-01",
              "show_icons": true,
              "include_all_commits": true,
              "hide_rank": false,
              "hide_border": true,
              "bg_color": "0D1117",
              "title_color": "8B5CF6",
              "text_color": "C9D1D9",
              "icon_color": "8B5CF6",
              "border_color": "8B5CF6",
              "border_radius": 10
            }
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================
      # TOP LANGUAGES
      # ==================================================
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            {
              "username": "raghavpandey-01",
              "layout": "compact",
              "langs_count": 6,
              "hide_border": true,
              "bg_color": "0D1117",
              "title_color": "8B5CF6",
              "text_color": "C9D1D9",
              "border_color": "8B5CF6",
              "border_radius": 10
            }
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================
      # GET GITHUB CONTRIBUTION DATA
      # ==================================================
      - name: Get GitHub Contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta

          username = "raghavpandey-01"

          # GitHub GraphQL query
          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          result = subprocess.run(
              [
                  "gh",
                  "api",
                  "graphql",
                  "-f", f"query={query}",
                  "-f", f"login={username}"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          data = json.loads(result.stdout)

          days = []

          weeks = (
              data["data"]["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
              ["weeks"]
          )

          for week in weeks:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          # Sort chronologically
          days.sort(key=lambda x: x["date"])

          # Save raw contribution data
          with open("profile/contributions.json", "w") as f:
              json.dump(days, f, indent=2)

          print(f"Fetched {len(days)} contribution days")

          # ==================================================
          # CALCULATE CURRENT STREAK
          # ==================================================

          today = datetime.utcnow().date()

          contribution_dates = {
              datetime.strptime(d["date"], "%Y-%m-%d").date()
              for d in days
              if d["count"] > 0
          }

          # GitHub's contribution calendar can be one day ahead/behind
          # depending on timezone. Check today first, then yesterday.
          if today in contribution_dates:
              current_date = today
          elif today - timedelta(days=1) in contribution_dates:
              current_date = today - timedelta(days=1)
          else:
              current_date = None

          current_streak = 0
          current_start = None
          current_end = None

          if current_date:
              current_end = current_date
              d = current_date

              while d in contribution_dates:
                  current_streak += 1
                  current_start = d
                  d -= timedelta(days=1)

          # ==================================================
          # CALCULATE LONGEST STREAK
          # ==================================================

          longest_streak = 0
          longest_start = None
          longest_end = None

          sorted_dates = sorted(contribution_dates)

          if sorted_dates:
              streak_start = sorted_dates[0]
              previous = sorted_dates[0]

              for d in sorted_dates[1:]:
                  if d == previous + timedelta(days=1):
                      previous = d
                  else:
                      length = (previous - streak_start).days + 1

                      if length > longest_streak:
                          longest_streak = length
                          longest_start = streak_start
                          longest_end = previous

                      streak_start = d
                      previous = d

              # Final streak
              length = (previous - streak_start).days + 1

              if length > longest_streak:
                  longest_streak = length
                  longest_start = streak_start
                  longest_end = previous

          # ==================================================
          # PRINT RESULTS
          # ==================================================

          print()
          print("========================================")
          print("       GITHUB CONTRIBUTION STATS")
          print("========================================")

          if current_streak > 0:
              print(
                  f"Current streak: {current_streak} days "
                  f"({current_start} -> {current_end})"
              )
          else:
              print("Current streak: 0 days")

          print(
              f"Longest streak: {longest_streak} days "
              f"({longest_start} -> {longest_end})"
          )

          print("========================================")

          # ==================================================
          # SAVE STREAK DATA
          # ==================================================

          streak_data = {
              "current_streak": current_streak,
              "current_start": str(current_start) if current_start else None,
              "current_end": str(current_end) if current_end else None,
              "longest_streak": longest_streak,
              "longest_start": str(longest_start) if longest_start else None,
              "longest_end": str(longest_end) if longest_end else None
          }

          with open("profile/streak-data.json", "w") as f:
              json.dump(streak_data, f, indent=2)

          PY

      # ==================================================
      # GENERATE STREAK SVG
      # ==================================================
      - name: Generate Contribution Streak SVG
        run: |
          python3 <<'PY'
          import json

          with open("profile/streak-data.json") as f:
              data = json.load(f)

          current = data["current_streak"]
          longest = data["longest_streak"]

          current_start = data["current_start"]
          current_end = data["current_end"]

          longest_start = data["longest_start"]
          longest_end = data["longest_end"]

          width = 850
          height = 260

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="{width}"
          height="{height}"
          viewBox="0 0 {width} {height}">

          <rect width="100%" height="100%"
                rx="12"
                fill="#0D1117"/>

          <text x="425"
                y="45"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="24"
                font-weight="bold"
                fill="#8B5CF6">
            Contribution Streak
          </text>

          <!-- Current Streak -->

          <text x="210"
                y="100"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="16"
                fill="#C9D1D9">
            Current Streak
          </text>

          <text x="210"
                y="145"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="38"
                font-weight="bold"
                fill="#FFFFFF">
            {current}
          </text>

          <text x="210"
                y="170"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="14"
                fill="#8B5CF6">
            days
          </text>

          <text x="210"
                y="200"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="12"
                fill="#C9D1D9">
            {current_start or ""}
            {" → " if current_start else ""}
            {current_end or ""}
          </text>


          <!-- Longest Streak -->

          <text x="640"
                y="100"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="16"
                fill="#C9D1D9">
            Longest Streak
          </text>

          <text x="640"
                y="145"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="38"
                font-weight="bold"
                fill="#FFFFFF">
            {longest}
          </text>

          <text x="640"
                y="170"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="14"
                fill="#8B5CF6">
            days
          </text>

          <text x="640"
                y="200"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="12"
                fill="#C9D1D9">
            {longest_start or ""}
            {" → " if longest_start else ""}
            {longest_end or ""}
          </text>

          </svg>
          '''

          with open("profile/streak.svg", "w") as f:
              f.write(svg)

          print("Streak SVG generated successfully.")
          PY

      # ==================================================
      # GITHUB TROPHIES
      # ==================================================
      - name: Generate GitHub Trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: raghavpandey-01
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: darkhub

      # ==================================================
      # VERIFY
      # ==================================================
      - name: Verify generated files
        run: |
          echo "Generated profile files:"
          ls -lh profile/

          echo ""
          echo "Streak data:"
          cat profile/streak-data.json

      # ==================================================
      # COMMIT
      # ==================================================
      - name: Commit generated profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg
          git add profile/*.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub profile statistics"
            git push
          fi
